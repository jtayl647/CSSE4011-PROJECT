syntax = "proto3";

import "nanopb.proto";

message DataReadings {
    int32 temp = 1;
    int32 humidity = 2;
    int32 pressure = 3;
    int32 moisture = 4;
    int32 meas_time = 5;
}

message SensorNode {
    bytes mac_address = 1;
    int32 sensor_sees_mobile = 2;
    int32 mobile_sees_sensor = 3;
    repeated DataReadings readings = 4;
}

message Nodes {
    repeated SensorNode nodes = 1;
    int32 mobile_sees_base = 2;
}