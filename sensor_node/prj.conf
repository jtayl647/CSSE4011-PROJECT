# This is for the NUS BLE.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SensorNode"
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_LOG=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# This is for the sensor logic.
CONFIG_SENSOR=y
CONFIG_ADC=y

# This is a example sensor we did in pracs.
CONFIG_CSSE4011_TMP36=y

CONFIG_NANOPB=y