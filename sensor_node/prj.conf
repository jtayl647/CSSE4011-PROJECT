# This is for the NUS BLE.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SensorNode"
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# This is for the sensor logic.
CONFIG_SENSOR=y
CONFIG_ADC=y

# NanoPB
CONFIG_NANOPB=y

# SparkFun soil moisture sensor on AIN0 (P0.02 / D0).
CONFIG_CSSE4011_SOIL=y

# M5Stack ENV III — SHT30 (temp + humidity) + QMP6988 (pressure).
CONFIG_I2C=y
CONFIG_SHT3XD=y
CONFIG_CSSE4011_QMP6988=y


#LittleFS
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_APP_WIPE_STORAGE=y

CONFIG_DEBUG=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y