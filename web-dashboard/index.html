<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; padding: 24px; }
    h1 { font-size: 1.3rem; margin-bottom: 20px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .card {
      background: #1a1f2e;
      border: 1px solid #2d3348;
      border-radius: 10px;
      padding: 16px;
    }
    .card .label { font-size: 0.7rem; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
    .card .value { font-size: 1.9rem; font-weight: 700; }
    .card .unit  { font-size: 0.8rem; color: #64748b; }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
    }
    .chart-box {
      background: #1a1f2e;
      border: 1px solid #2d3348;
      border-radius: 10px;
      padding: 16px;
    }
    .chart-box h2 { font-size: 0.75rem; text-transform: uppercase; color: #64748b; margin-bottom: 10px; }
    canvas { max-height: 160px; }
  </style>
</head>
<body>

<h1>🌱 Sensor Dashboard</h1>

<div class="cards">
  <div class="card">
    <div class="label">Soil Moisture</div>
    <div><span class="value" id="v-moisture" style="color:#38bdf8">--</span> <span class="unit">%</span></div>
  </div>
  <div class="card">
    <div class="label">Temperature</div>
    <div><span class="value" id="v-temp" style="color:#fb923c">--</span> <span class="unit">°C</span></div>
  </div>
  <div class="card">
    <div class="label">Humidity</div>
    <div><span class="value" id="v-humidity" style="color:#a78bfa">--</span> <span class="unit">%</span></div>
  </div>
  <div class="card">
    <div class="label">Pressure</div>
    <div><span class="value" id="v-pressure" style="color:#34d399">--</span> <span class="unit">hPa</span></div>
  </div>
</div>

<div class="charts">
  <div class="chart-box"><h2>Soil Moisture (%)</h2><canvas id="c-moisture"></canvas></div>
  <div class="chart-box"><h2>Temperature (°C)</h2><canvas id="c-temp"></canvas></div>
  <div class="chart-box"><h2>Humidity (%)</h2><canvas id="c-humidity"></canvas></div>
  <div class="chart-box"><h2>Pressure (hPa)</h2><canvas id="c-pressure"></canvas></div>
</div>

<script>
  // ── chart factory ──────────────────────────────────────────────────────────
  function makeChart(id, color) {
    return new Chart(document.getElementById(id), {
      type: 'line',
      data: { labels: [], datasets: [{ data: [], borderColor: color,
        backgroundColor: color + '22', borderWidth: 2, pointRadius: 3,
        tension: 0.3, fill: true }] },
      options: {
        animation: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#475569', maxTicksLimit: 5 }, grid: { color: '#252b3b' } },
          y: { ticks: { color: '#475569' }, grid: { color: '#252b3b' } }
        }
      }
    });
  }

  const charts = {
    moisture: makeChart('c-moisture', '#38bdf8'),
    temp:     makeChart('c-temp',     '#fb923c'),
    humidity: makeChart('c-humidity', '#a78bfa'),
    pressure: makeChart('c-pressure', '#34d399'),
  };

  // ── mock state ─────────────────────────────────────────────────────────────
  let moisture = 65, temp = 24, humidity = 55, pressure = 1013;

  function tick() {
    moisture = Math.max(0,   Math.min(100,  moisture + (Math.random() - 0.5) * 3));
    temp     = Math.max(15,  Math.min(40,   temp     + (Math.random() - 0.5) * 0.4));
    humidity = Math.max(20,  Math.min(90,   humidity + (Math.random() - 0.5) * 1.5));
    pressure = Math.max(995, Math.min(1030, pressure + (Math.random() - 0.5) * 0.3));

    const label = new Date().toLocaleTimeString();

    document.getElementById('v-moisture').textContent = Math.round(moisture);
    document.getElementById('v-temp').textContent     = temp.toFixed(1);
    document.getElementById('v-humidity').textContent = Math.round(humidity);
    document.getElementById('v-pressure').textContent = pressure.toFixed(1);

    for (const [key, chart] of Object.entries(charts)) {
      const val = { moisture, temp, humidity, pressure }[key];
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(+val.toFixed(1));
      if (chart.data.labels.length > 20) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update();
    }
  }

  tick();
  setInterval(tick, 3000); // update every 3s
</script>
</body>
</html>
